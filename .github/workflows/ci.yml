name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  QT_VERSION: "6.12.0"
  AQT_VERSION: "==3.3.*"

jobs:
  format:
    name: Check formatting
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt (qmlformat)
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          aqtversion: ${{ env.AQT_VERSION }}
          cache: true
      - run: pipx install clang-format==19.1.6
      - run: QMLFORMAT="$QT_ROOT_DIR/bin/qmlformat" tools/format-code.sh --check

  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64)
            os: macos-26
            host: mac
            arch: clang_64
          - name: Linux (x86_64)
            os: ubuntu-24.04
            host: linux
            arch: linux_gcc_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.host }}
          target: desktop
          arch: ${{ matrix.arch }}
          aqtversion: ${{ env.AQT_VERSION }}
          cache: true

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev

      - name: Configure
        run: |
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/ci

      - name: Test
        run: ctest --test-dir build/ci --output-on-failure
